<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.checked</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="div1">
        <input type="checkbox" id="mycheckbox">
        <label for="mycheckbox">Subscribe</label>
        <br>
        <br>
        <input type="radio" id="visa" name="card">   <!--here we are using 'name' attribute to group all radio type inputs so that you can only select only one option-->
        <label for="visa">Visa</label>
        <br>
        <input type="radio" id="mastercard" name="card">
        <label for="visa">Mastercard</label>
        <br>
        <input type="radio" id="phonepay" name="card">
        <label for="visa">Phonepay</label>
        <br>
        <br>
        <button type="submit" id="mysubmit">Submit</button>
        <br>
        <br>
        <p id="submitresult"></p>
        <p id="paymentresult"></p>
    </div>

    <script src="index.js"></script>
</body>
</html>
